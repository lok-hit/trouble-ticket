spring:
  datasource:
    # Overridden at runtime by CucumberSpringConfiguration @DynamicPropertySource (Testcontainers)
    url: jdbc:postgresql://localhost:5432/troubleticket
    username: tt_user
    password: tt_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Overridden at runtime by TestSecurityConfig @Primary JwtDecoder bean (RSA key in-memory)
          issuer-uri: http://test-issuer

logging:
  level:
    pl.netia: DEBUG
    org.testcontainers: WARN

spring:
  datasource:
    url: ${TEST_DATASOURCE_URL:jdbc:tc:postgresql:16-alpine:///troubleticket}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Use a self-signed JWKS in tests (TestJwtConfig provides RSA key)
          jwk-set-uri: ${TEST_JWKS_URI:http://localhost:0/jwks}

logging:
  level:
    pl.netia: DEBUG
    org.testcontainers: WARN

spring:
  application:
    name: trouble-ticket-service

  datasource:
    url: jdbc:postgresql://localhost:5432/troubleticket
    username: tt_user
    password: tt_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/netia}

server:
  port: 8080

logging:
  level:
    pl.netia: DEBUG

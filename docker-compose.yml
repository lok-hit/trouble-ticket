services:

  postgres:
    image: postgres:16-alpine
    container_name: trouble-ticket-db
    environment:
      POSTGRES_DB: troubleticket
      POSTGRES_USER: tt_user
      POSTGRES_PASSWORD: tt_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tt_user -d troubleticket"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trouble-ticket-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/troubleticket
      SPRING_DATASOURCE_USERNAME: tt_user
      SPRING_DATASOURCE_PASSWORD: tt_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8180/realms/netia}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
